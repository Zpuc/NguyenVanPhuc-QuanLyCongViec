services:
  postgres:
    image: postgres:16-alpine
    container_name: taskmaster_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: vanphuc04
      POSTGRES_DB: task_management_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d task_management_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  vault:
    image: hashicorp/vault:latest
    container_name: taskmaster_vault
    restart: always
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    healthcheck:
      test: ["CMD-SHELL", "VAULT_ADDR=http://127.0.0.1:8200 vault status"]
      interval: 3s
      timeout: 3s
      retries: 10

  vault-init:
    image: hashicorp/vault:latest
    container_name: taskmaster_vault_init
    restart: "no"
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
    depends_on:
      vault:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        vault kv put secret/taskmaster DATABASE_URL="postgresql://postgres:vanphuc04@postgres:5432/task_management_db?schema=public" PORT="3000" JWT_SECRET="zpuc" JWT_EXPIRES_IN="7d"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskmaster_backend
    restart: always
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
      VAULT_SECRET_PATH: secret/data/taskmaster
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully

  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: taskmaster_worker
    restart: always
    command: ["node", "dist/worker"]
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
      VAULT_SECRET_PATH: secret/data/taskmaster
    depends_on:
      postgres:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: taskmaster_frontend
    restart: always
    ports:
      - "5173:80"
      - "80:80"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
